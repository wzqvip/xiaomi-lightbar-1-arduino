; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  nrf24/RF24@^1.6.2
build_flags = -I include

; --- local settings for this machine -------------------------------------
; RF-Nano V1.0 clone: CH340G USB-serial adapter shows up as COM42.
upload_port = COM42
monitor_port = COM42
monitor_speed = 115200
; This RF-Nano clone ships with the newer (optiboot) bootloader, which talks
; at 115200. Use 57600 instead if you get "not in sync" on an older board.
upload_speed = 115200
